name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.45

      - name: Install Dependencies
        run: bun install

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Standalone binaries for the platforms the release advertises. Cross
      # compilation downloads a runtime matching the compiler's version, so
      # this needs a released Bun — which is what the pantry setup step above
      # provides.
      - name: Build release binaries
        run: bun run build:binaries

      # Pantry attaches the binaries and extracts this tag's section from
      # CHANGELOG.md for the body. The previous action-releaser step passed no
      # notes input at all, so every release back to v0.9.20 published empty,
      # and its globs pointed at binaries nothing built.
      #
      # Needs >= v0.11: the v0.9 extractor matched the bare version with a word
      # boundary, so `v0.10.1` in a compare link never matched — there is no
      # boundary between `v` and `0`. `release-checksums` also only exists from
      # the newer action.
      - name: Create GitHub Release
        uses: pantry-pm/pantry/packages/action@v0.11.45
        with:
          release: true
          release-changelog: CHANGELOG.md
          release-checksums: 'true'
          release-files: |
            ./bin/buddy-linux-x64.zip
            ./bin/buddy-linux-arm64.zip
            ./bin/buddy-windows-x64.zip
            ./bin/buddy-darwin-x64.zip
            ./bin/buddy-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Binaries are ~150 MB a version, so old ones are pruned — but not down to
      # only the newest. The pantry recipe (packages/ts-pantry/src/recipes/buddy.sh.ts
      # in pantry-pm/pantry) builds its package by downloading these assets, and
      # its build farm works through several recent versions per run. Keeping
      # only the newest meant every version but one 404'd at build time.
      #
      # KEEP_RELEASES is therefore a contract with that build farm, not just a
      # storage preference: lowering it below pantry's max-versions breaks
      # installs of anything but the very latest.
      #
      # Only names this workflow produces are pruned, so an asset somebody
      # attached by hand is never touched. The buddy-bot-* names are the
      # pre-rename spelling, left stranded on releases up to v0.10.5.
      #
      # Housekeeping, so it must not fail a release that already succeeded —
      # the package is on npm and the release exists by this point.
      - name: Prune binaries from older releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
          KEEP_RELEASES: '3'
        run: |
          set -uo pipefail

          PLATFORMS="linux-x64 linux-arm64 windows-x64 darwin-x64 darwin-arm64"
          PRUNABLE="checksums.txt release-manifest.json"
          for platform in $PLATFORMS; do
            PRUNABLE="$PRUNABLE buddy-${platform}.zip buddy-bot-${platform}.zip"
          done

          # Releases newest-first, minus the ones whose binaries stay.
          KEPT=$(gh release list --limit 30 --json tagName --jq '.[].tagName' | head -n "$KEEP_RELEASES")
          echo "Keeping binaries on: $(echo "$KEPT" | tr '\n' ' ')"

          for tag in $(gh release list --limit 30 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$CURRENT_TAG" ] && continue
            if echo "$KEPT" | grep -qxF "$tag"; then
              continue
            fi

            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              case " $PRUNABLE " in
                *" $asset "*)
                  echo "Pruning $asset from $tag"
                  gh release delete-asset "$tag" "$asset" --yes || true
                  ;;
              esac
            done
          done
