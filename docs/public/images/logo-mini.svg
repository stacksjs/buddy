<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Buddy">
  <!-- Buddy: a floppy-eared hound. Ears and muzzle are separate rounded
       rectangles unioned by the mask, so the silhouette keeps three lobes at
       the top and a snout below — the shape that still reads as a dog at 16px. -->
  <mask id="buddy-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="black"/>
    <g fill="white">
      <rect x="4" y="14" width="18" height="32" rx="9" transform="rotate(-8 13 30)"/>
      <rect x="42" y="14" width="18" height="32" rx="9" transform="rotate(8 51 30)"/>
      <rect x="15" y="7" width="34" height="31" rx="13"/>
      <rect x="23" y="29" width="18" height="21" rx="9"/>
    </g>
    <g fill="black">
      <circle cx="25.5" cy="25" r="2.9"/>
      <circle cx="38.5" cy="25" r="2.9"/>
      <rect x="28.5" y="35.5" width="7" height="5" rx="2.5"/>
    </g>
  </mask>
  <rect width="64" height="64" fill="#000000" mask="url(#buddy-mask)"/>
</svg>
